name: Bug report
description: Tell us what went wrong so we can reproduce and fix it
title: "[Bug]: "
labels:
  - "type:bug"
  - "status:needs-investigation"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        Please search existing issues first. Include exact text where you can,
        and remove private or sensitive information before attaching anything.
        Provider guide and playlist files often contain account names, tokens,
        and private URLs. Never paste those.

  - type: input
    id: summary
    attributes:
      label: Problem summary
      description: In one short sentence, what is going wrong?
      placeholder: Example - A pay-per-view channel kept its provider guide instead of getting an event guide
    validations:
      required: true

  - type: input
    id: channelforge-version
    attributes:
      label: ChannelForge version or release
      description: Enter the exact version or release identifier shown by your copy. Check the Releases page if you need help identifying it.
      placeholder: Example - v0.1.0 or a development build
    validations:
      required: true

  - type: textarea
    id: windows-powershell
    attributes:
      label: Windows and PowerShell environment
      description: Include Windows edition and build, 32-bit or 64-bit, PowerShell version, and how you started ChannelForge (for example Windows PowerShell, PowerShell 7, Windows Terminal, the desktop app, or a scheduled task).
      placeholder: |
        Windows edition/build:
        Architecture:
        PowerShell version:
        How ChannelForge was started:
    validations:
      required: true

  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      description: Choose the closest match. Maintainers use this to apply the repository's component label.
      options:
        - Desktop app screens, setup, or review (component:ux)
        - Channel matching, names, or corrections (component:identity)
        - Guide data, artwork, or stream details (component:guide-media)
        - Event or sports channels and event guides (component:events)
        - Output files, playlists, or deployment (component:delivery)
        - Stored data, schemas, or saved state (component:data)
        - Automation, scheduled runs, or notifications (component:operations)
        - Rules, policy packs, or adapters (component:policy-sdk)
        - Security or secrets (component:security)
        - Tests or test tooling (component:testing)
        - Documentation (component:documentation)
        - Release packaging or versioning (component:release)
        - GitHub, CI, or repository tooling (component:github)
        - Other or not sure
    validations:
      required: true

  - type: input
    id: affected-item
    attributes:
      label: Affected channel, provider, or feature
      description: Name the channel, provider guide, playlist, screen, or command involved. If none applies, say so. Do not include account names or private URLs.
      placeholder: Example - "PPV1" channel from my provider guide, during Build-Lineup
    validations:
      required: true

  - type: textarea
    id: trying-to-do
    attributes:
      label: What were you trying to do?
      description: Describe the task you were performing just before the problem happened.
      placeholder: |
        I was trying to...
    validations:
      required: true

  - type: textarea
    id: observed-behavior
    attributes:
      label: What happened?
      description: Describe exactly what you saw. Paste the complete error text or console output when available. If there was no error text, say "No error text".
      placeholder: |
        Exact error text or observed behavior:
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect to happen?
      description: Describe the result you expected from that action. For guide problems, include the correct title, start time, venue, or channel if you know them.
      placeholder: |
        I expected...
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: Give numbered steps from a clean start or known state. Include the exact screens, commands, options, and file names needed to reproduce it.
      placeholder: |
        1. Start with...
        2. Choose...
        3. Observe...
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: Does it reproduce consistently?
      description: Choose the result of repeating the same steps.
      options:
        - Every time
        - Most times
        - Intermittent or timing-dependent
        - Happened once and cannot be reproduced
        - Not tested yet
    validations:
      required: true

  - type: textarea
    id: input-files
    attributes:
      label: Provider guide, playlist, or other input (only if relevant)
      description: Tell us what kind of input was involved (provider guide or playlist) and its approximate size. If you can, attach a small redacted excerpt that still shows the problem, such as the few channel and programme lines involved. Do not attach complete files.
      placeholder: |
        Input type and size, or "Not relevant":

  - type: textarea
    id: recent-changes
    attributes:
      label: Recent changes
      description: List anything that changed before the problem appeared, such as a ChannelForge update, a new provider guide, an edited setting, a moved folder, or a Windows update. If nothing changed, say "None known".
      placeholder: |
        Recent changes:

  - type: textarea
    id: logs-and-screenshots
    attributes:
      label: Logs, reports, or screenshots
      description: Optional. Before pasting or attaching anything, remove passwords, tokens, API keys, account names, personal data, private URLs or paths, IP addresses, usernames, and machine names that are not needed. Review screenshots for the same information. If none are available, say "None".
      placeholder: |
        Paste a redacted excerpt or drag in a redacted file or screenshot:

  - type: textarea
    id: workaround
    attributes:
      label: Workaround (if known)
      description: Tell us whether anything lets you complete the task, even if it is temporary.
      placeholder: |
        Workaround, or "None known":

  - type: checkboxes
    id: pre-submit-checklist
    attributes:
      label: Pre-submit checklist
      description: Please confirm each item before submitting.
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I included the exact ChannelForge version and environment details, or said when they are unavailable.
          required: true
        - label: I included exact observed text and reproduction steps, or explained what is missing.
          required: true
        - label: I removed secrets and private information from logs, guides, playlists, and screenshots.
          required: true
        - label: I described the expected behavior and whether the problem reproduces consistently.
          required: true
