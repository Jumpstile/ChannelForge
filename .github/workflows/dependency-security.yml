name: SBOM

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: Repository SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare ignored SBOM output directory
        run: mkdir -p output/security

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: output/security/channelforge.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Upload SBOM as a short-lived CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: channelforge-sbom-${{ github.sha }}
          path: output/security/channelforge.sbom.spdx.json
          if-no-files-found: error
          retention-days: 14
