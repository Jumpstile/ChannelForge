name: Main Smoke

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  main-secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  main-smoke:
    needs: main-secret-scan
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run fast main-branch smoke checks
        shell: pwsh
        run: |
          & ./scripts/Validate-ConfigSchemas.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & ./scripts/Validate-MarkdownHygiene.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & ./scripts/Validate-MarkdownLinks.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
