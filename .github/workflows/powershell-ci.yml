name: PowerShell CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded PR runs while preserving every main-branch run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality-gates:
    needs: secret-scan
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22 for repository and GUI checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Set up stable Rust for optional Tauri checks
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch pinned v9 canonical content commit
        shell: pwsh
        env:
          CHANNELFORGE_V9_CANONICAL_COMMIT: "121e25d73e70ec1d132cc56b87a90325d1efec29"
        run: |
          git fetch --no-tags --depth=1 origin $env:CHANNELFORGE_V9_CANONICAL_COMMIT
          if ($LASTEXITCODE -ne 0) {
              throw "Unable to fetch the pinned v9 canonical content commit."
          }
          git cat-file -e "$($env:CHANNELFORGE_V9_CANONICAL_COMMIT)^{commit}"
          if ($LASTEXITCODE -ne 0) {
              throw "Pinned v9 canonical content commit is unavailable after fetch."
          }

      - name: Validate Prettier formatting
        shell: pwsh
        run: |
          npm ci
          npm run format:check

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install PowerShell 7.6 global tool
        shell: pwsh
        env:
          CHANNELFORGE_PWSH_VERSION: "7.6.4"
        run: |
          $toolPath = Join-Path $env:RUNNER_TEMP 'channelforge-pwsh'
          dotnet tool install `
              --tool-path $toolPath `
              PowerShell `
              --version $env:CHANNELFORGE_PWSH_VERSION

          $pwshPath = Join-Path $toolPath 'pwsh.exe'
          if (-not (Test-Path -LiteralPath $pwshPath -PathType Leaf)) {
              throw "PowerShell $env:CHANNELFORGE_PWSH_VERSION was not installed at the expected path."
          }

          "CHANNELFORGE_PWSH=$pwshPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify PowerShell and .NET runtime contract
        shell: pwsh
        run: |
          $runtimeCommand = '$PSVersionTable.PSVersion; $PSVersionTable.PSEdition; [System.Environment]::Version; if ([version]$PSVersionTable.PSVersion -lt [version]''7.6'') { throw ''ChannelForge requires PowerShell 7.6 or newer.'' }; if ($PSVersionTable.PSEdition -ne ''Core'') { throw ''ChannelForge requires PowerShell Core.'' }; if ([version][System.Environment]::Version -lt [version]''10.0'') { throw ''ChannelForge requires a .NET 10 or newer hosting runtime.'' }'
          & $env:CHANNELFORGE_PWSH -NoLogo -NoProfile -Command $runtimeCommand
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Install Pester 5.7.1 and PSScriptAnalyzer 1.25.0
        shell: pwsh
        run: |
          $toolCommand = 'if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) { Register-PSRepository -Default }; Set-PSRepository -Name PSGallery -InstallationPolicy Trusted; Install-Module Pester -RequiredVersion 5.7.1 -Repository PSGallery -Force -Scope CurrentUser -SkipPublisherCheck; Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Repository PSGallery -Force -Scope CurrentUser -SkipPublisherCheck'
          & $env:CHANNELFORGE_PWSH -NoLogo -NoProfile -Command $toolCommand
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      # Fast, narrow checks run first so an easy mistake (a malformed config
      # file, a broken doc link) fails quickly, before the full test suite.
      - name: Validate config schemas
        shell: pwsh
        run: |
          & $env:CHANNELFORGE_PWSH -NoLogo -NoProfile -File ./scripts/Validate-ConfigSchemas.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Markdown hygiene
        shell: pwsh
        run: |
          & $env:CHANNELFORGE_PWSH -NoLogo -NoProfile -File ./scripts/Validate-MarkdownHygiene.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Markdown links
        shell: pwsh
        run: |
          & $env:CHANNELFORGE_PWSH -NoLogo -NoProfile -File ./scripts/Validate-MarkdownLinks.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          & $env:CHANNELFORGE_PWSH -NoLogo -NoProfile -File ./scripts/Validate-ScriptAnalyzer.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Pester tests
        shell: pwsh
        run: |
          & $env:CHANNELFORGE_PWSH -NoLogo -NoProfile -Command 'Invoke-Pester ./tests/unit -CI'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install GUI dependencies
        shell: pwsh
        working-directory: gui
        run: npm ci

      - name: Run GUI TypeScript typecheck
        shell: pwsh
        working-directory: gui
        run: npm run typecheck

      - name: Run GUI unit tests
        shell: pwsh
        working-directory: gui
        run: npm test

      - name: Run optional Tauri wrapper Rust tests
        shell: pwsh
        working-directory: gui
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
