name: PowerShell CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality-gates:
    needs: secret-scan
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pester 5.7.1 and PSScriptAnalyzer 1.25.0
        shell: pwsh
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
              Register-PSRepository -Default
          }

          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

          Install-Module Pester `
              -RequiredVersion 5.7.1 `
              -Repository PSGallery `
              -Force `
              -Scope CurrentUser `
              -SkipPublisherCheck

          Install-Module PSScriptAnalyzer `
              -RequiredVersion 1.25.0 `
              -Repository PSGallery `
              -Force `
              -Scope CurrentUser `
              -SkipPublisherCheck

      # Fast, narrow checks run first so an easy mistake (a malformed config
      # file, a broken doc link) fails quickly, before the full test suite.
      - name: Validate config schemas
        shell: pwsh
        run: ./scripts/Validate-ConfigSchemas.ps1

      - name: Validate Markdown hygiene
        shell: pwsh
        run: ./scripts/Validate-MarkdownHygiene.ps1

      - name: Validate Markdown links
        shell: pwsh
        run: ./scripts/Validate-MarkdownLinks.ps1

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: ./scripts/Validate-ScriptAnalyzer.ps1

      - name: Run Pester tests
        shell: pwsh
        run: Invoke-Pester ./tests/unit -CI
