name: Security gated validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-gated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-security-tests:
    name: Windows security tests
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install supported PowerShell runtime
        shell: pwsh
        env:
          CHANNELFORGE_PWSH_VERSION: "7.6.4"
        run: |
          $toolPath = Join-Path $env:RUNNER_TEMP 'channelforge-pwsh'
          dotnet tool install `
              --tool-path $toolPath `
              PowerShell `
              --version $env:CHANNELFORGE_PWSH_VERSION

          $pwshPath = Join-Path $toolPath 'pwsh.exe'
          if (-not (Test-Path -LiteralPath $pwshPath -PathType Leaf)) {
              throw "PowerShell $env:CHANNELFORGE_PWSH_VERSION was not installed at the expected path."
          }

          "CHANNELFORGE_PWSH=$pwshPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install pinned test modules
        shell: pwsh
        run: |
          $toolCommand = 'if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) { Register-PSRepository -Default }; Set-PSRepository -Name PSGallery -InstallationPolicy Trusted; Install-Module Pester -RequiredVersion 5.7.1 -Repository PSGallery -Force -Scope CurrentUser -SkipPublisherCheck; Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Repository PSGallery -Force -Scope CurrentUser -SkipPublisherCheck'
          & $env:CHANNELFORGE_PWSH -NoLogo -NoProfile -Command $toolCommand
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Verify supported runtime
        shell: pwsh
        run: |
          & $env:CHANNELFORGE_PWSH -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion; $PSVersionTable.PSEdition; [System.Environment]::Version; if ([version]$PSVersionTable.PSVersion -lt [version]''7.6'') { throw ''ChannelForge requires PowerShell 7.6 or newer.'' }; if ($PSVersionTable.PSEdition -ne ''Core'') { throw ''ChannelForge requires PowerShell Core.'' }; if ([version][System.Environment]::Version -lt [version]''10.0'') { throw ''ChannelForge requires a .NET 10 or newer hosting runtime.'' }'
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Run security tests
        shell: pwsh
        run: |
          $testCommand = @'
          Invoke-Pester -Path @(
              './tests/unit/WriteGuardrails.Tests.ps1',
              './tests/unit/SourceUrlValidation.Tests.ps1',
              './tests/unit/PinnedHttpTransportLoader.Tests.ps1',
              './tests/unit/PinnedHttpTransportEndpoint.Tests.ps1',
              './tests/unit/PinnedHttpTransportConnection.Tests.ps1',
              './tests/unit/PinnedHttpTransportAcquisition.Tests.ps1',
              './tests/unit/ChannelForgeAutoUpdate.DestructivePath.Tests.ps1'
          ) -CI -Output Detailed
          '@
          & $env:CHANNELFORGE_PWSH -NoLogo -NoProfile -Command $testCommand
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          & $env:CHANNELFORGE_PWSH -NoLogo -NoProfile -File ./scripts/Validate-ScriptAnalyzer.ps1
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }
