[package]
name = "channelforge_gui"
version = "0.1.0"
description = "ChannelForge guided workbench shell"
authors = ["Jumpstile"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "channelforge_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15.4"
quick-xml = "0.42"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri = { version = "2.11.1", features = [] }
