[package]
name = "channelforge_gui"
version = "0.1.0"
description = "ChannelForge guided workbench shell"
authors = ["Jumpstile"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "channelforge_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
rfd = "0.15.4"
tauri = { version = "2.11.1", features = [] }

[dev-dependencies]
serde_json = "1"
